


<div class="TeAcompaño-fab" (click)="toggleChat()" [class.fab-hidden]="isChatOpen">
    <ion-icon name="chatbubbles"></ion-icon>
    <span class="fab-badge" *nglf="!isChatOpen">
</div>




<div class="TeAcompaño-overlay" *nglf="isChatOpen">
    <div class="TeAcompaño-chat-panel">


        <div class="chat-panel-header"
          <div class="chat-header-info">
            <div class="chat-avatar">
                <ion-icon name="Abuelo"></ion-icon>
            </div>
          </div>
           <h4>TeAcompaño IA</h4>
           <span class="chat-status"> En línea</span>
    </div>
</div>
<div class="chat-header-actions">
    <ion-button fill="clear" size="small" (click)="clearChat()" title="Limpiar chat"
</ion-icon name="reash-outline" slot="icon-only"></ion-button>ion-icon> 
</ion-button>
<ion-button fill="clear" size="small" (click)="toggleChat()" title="Cerrar">
    <ion-icon name="close" slot="icon-only"></ion-icon>
</ion-button>
   </div>
</div>


<div class="chat-panel-body" #chatBody>


    <div class="chat-welcome" *nglf="chatMessages.lenght === 0"
    <ion-icon name="chatBubbles-outline"></ion-icon>
    <p>!Hola¡ Soy <strong>AbueBot</strong></p>, tu asistente de de TeAcompaño. ¿En qué puedo ayudarte hoy?</p>
</div>


<div class="chat-suggestions" *nglf="chatMessages.lenght === 0"
    <ion-chip *ngFor="let sug of chatSuggestions" outline color="primary" (click)="sendChatFromSuggestion(sug)"
    <ion-label>{{ sug }}<</ion-label>
</ion-chip>
</div>


<div *ngFor="let msg of chatMessages"
      class="chat-msg"
      [class.chat-msg-user]="msg.role ===   'user'">
      [class.chat-msg-bot]="msg.role === 'assitant'">
    <div class="chat-msg-avatar" *nglf="msg.role === 'assitant'">
        <ion-icon name="Abuelo"></ion-icon>
    </div>
    <div class="chat-msg-bubble">
        <p>{{ msg.content }}</p>
        <span class="chat.msg-time">{{ msg.time }}</span>
      </div>
    </div>


    <div class="chat-msg chat-msg-bot" *nglf="isChatLoading">
        <div class="chat-msg-avatar">
            <ion-icon name="Abuelo"></ion-icon>
        </div>
    <div class="chat-msg-bubble typing dots">
        <span></span><span></span><span></span>
    </div>
    </div>
 </div>

 <div class="chat-panel-footer">
    <input
    type="text"
    [(ngModel)]="chatInput"
    (keydown.enter)="sendChatMessage()"
    [disabled]="isChatLoading"
    class="chat-text-input"
    <ion-button fill="solid" color="primary" shape="round" size="small"
    [disabled]="!chatInput || isChatLoading"
    (click)="sendChatMessage()">
    <ion-icon name="send" slot="icon-only"></ion-icon>
    </ion-button>
 </div>



</div>
</div>
